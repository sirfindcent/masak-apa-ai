name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=production --scope=masak-apa --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build application
        run: vercel build --prod --scope=masak-apa --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy application
        run: vercel deploy --prebuilt --prod --scope=masak-apa --token=${{ secrets.VERCEL_TOKEN }}